services:
  database:
    container_name: BowlingTrackerSupreme.Database
    image: postgres:latest
    restart: unless-stopped
    ports:
      - 5432:5432/tcp
    networks:
      - bowling_backend
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Netcompany-123
      - POSTGRES_DB=BowlingTrackerSupreme
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - bowlingtrackersupreme_data:/var/lib/postgresql/data
      - ./scripts/initial_setup.sql:/docker-entrypoint-initdb.d/initial_setup.sql

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - 8888:8080/tcp
    networks:
      - bowling_backend

  frontend-dev:
    container_name: BowlingTrackerSupreme.Frontend
    build:
      context: ./src/BowlingTrackerSupreme.Vue
      dockerfile: Dockerfile
    ports:
      - 5173:5173/tcp
    volumes:
      - ./src/BowlingTrackerSupreme.Vue:/app
      - node_modules:/app/node_modules

volumes:
  bowlingtrackersupreme_data:
  node_modules: {}

networks:
  bowling_backend:
