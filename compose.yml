services:
  database:
    container_name: BowlingTrackerSupreme.Database
    image: postgres:latest
    restart: unless-stopped
    ports:
      - 5432:5432/tcp
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Netcompany-123
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - bowlingtrackersupreme_data:/var/lib/postgresql/data

  # adminer:
  #   image: adminer:latest
  #   restart: unless-stopped
  #   ports:
  #     - 8080:8080/tcp
  #   volumes:
  #     - bowlingtrackersupreme_data:/var/lib/postgresql/data

  frontend-dev:
    container_name: BowlingTrackerSupreme.Frontend
    build:
      context: ./src/BowlingTrackerSupreme.Vue
      dockerfile: Dockerfile
    ports:
      - 5173:5173/tcp
    volumes:
      - ./src/BowlingTrackerSupreme.Vue:/app
      - node_modules:/app/node_modules

  api:
    container_name: BowlingTrackerSupreme.API
    image: ${DOCKER_REGISTRY-}bowlingtrackersupremeapi
    build:
      context: ./src
      dockerfile: BowlingTrackerSupreme.Web/Dockerfile
    depends_on:
      - database
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;http://+8081
      - ConnectionStrings__BowlingTrackerSupremeDatabase=Host=database;Database=bowlingtrackersupreme;Username=postgres;Password=Netcompany-123
    ports:
      - 8080:8080/tcp
      - 8081:8081/tcp

volumes:
  bowlingtrackersupreme_data:
  node_modules: {}

